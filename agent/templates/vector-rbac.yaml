apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-vector
  labels:
    {{- include "cloudcosts-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: vector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-vector
  labels:
    {{- include "cloudcosts-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: vector
rules:
  # Required for kubernetes_logs source
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-vector
  labels:
    {{- include "cloudcosts-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-vector
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-vector
    namespace: {{ .Release.Namespace }}
