# k3d-specific values for monitoring agent

cluster:
  database: k3d_cloudcosts

greptimedb:
  urlBase: "http://cloudcosts-cluster-greptimedb-standalone.cloudcosts-cluster.svc:4000"
  username: "${GREPTIMEDB_USERNAME}"
  password: "${GREPTIMEDB_PASSWORD}"

opencost:
  opencost:
    exporter:
      defaultClusterId: k3d-cloudcosts
    prometheus:
      internal:
        enabled: false
      external:
        enabled: false
