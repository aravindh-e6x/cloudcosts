version: '3'

dotenv: ['../.env']

vars:
  IMAGE_NAME: 792306802931.dkr.ecr.us-east-1.amazonaws.com/cloudcosts/dashboard

tasks:
  install:
    desc: Install dependencies
    cmds:
      - npm ci

  dev:
    desc: Run development server
    cmds:
      - lsof -ti:3000 | xargs kill -9 2>/dev/null || true
      - npm run dev

  build:
    desc: Build for production
    cmds:
      - npm run build

  docker-build:
    desc: Build Docker image
    cmds:
      - docker build --platform linux/arm64 -t {{.IMAGE_NAME}}:latest .

  docker-push:
    desc: Push Docker image to ECR
    cmds:
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 792306802931.dkr.ecr.us-east-1.amazonaws.com
      - docker push {{.IMAGE_NAME}}:latest

  lint:
    desc: Run ESLint
    cmds:
      - npm run lint
