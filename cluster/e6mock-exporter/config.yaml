# E6 Mock Exporter Configuration
# This file controls the generation of mock data for the CloudCosts dashboard

# E6 Customers and their clusters
e6_customers:
  - name: condenast
    display_name: "ACME Corporation"
    clusters:
      - name: prod-cluster
        executors: 5
        containers: 12
        nodes:
          - prod-node-1
          - prod-node-2
          - prod-node-3
        namespaces:
          - e6data
          - default
          - kube-system
      - name: dev-cluster
        executors: 2
        containers: 6
        nodes:
          - dev-node-1
          - dev-node-2
        namespaces:
          - e6data
          - default

  - name: freshworks
    display_name: "Globex Industries"
    clusters:
      - name: analytics-cluster
        executors: 4
        containers: 10
        nodes:
          - analytics-node-1
          - analytics-node-2
          - analytics-node-3
        namespaces:
          - e6data
          - default
          - monitoring

  - name: cisco
    display_name: "Initech LLC"
    clusters:
      - name: staging-cluster
        executors: 3
        containers: 8
        nodes:
          - staging-node-1
          - staging-node-2
        namespaces:
          - e6data
          - default

# AWS Accounts (for CloudWatch metrics)
cloudwatch:
  accounts:
    - id: "123456789012"
      name: Production
    - id: "234567890123"
      name: Development
    - id: "345678901234"
      name: Staging

  regions:
    - us-east-1
    - us-west-2
    - eu-west-1

  # EC2 Instances
  ec2_instances:
    - instance_id: i-0abc123def456
      instance_type: m5.xlarge
      name: web-server-1
      az: a
    - instance_id: i-0def456abc789
      instance_type: m5.2xlarge
      name: app-server-1
      az: b
    - instance_id: i-0ghi789xyz012
      instance_type: r5.xlarge
      name: cache-server-1
      az: a
    - instance_id: i-0jkl012mno345
      instance_type: c5.2xlarge
      name: compute-1
      az: c
    - instance_id: i-0pqr345stu678
      instance_type: m5.4xlarge
      name: db-proxy-1
      az: b
    - instance_id: i-0vwx678yza901
      instance_type: t3.large
      name: bastion-1
      az: a
    - instance_id: i-0bcd901efg234
      instance_type: m5.xlarge
      name: worker-1
      az: b
    - instance_id: i-0efg234hij567
      instance_type: m5.xlarge
      name: worker-2
      az: c

  # EKS Clusters
  eks_clusters:
    - name: prod-eks
      nodes:
        - ip-10-0-1-101
        - ip-10-0-2-102
        - ip-10-0-3-103
      namespaces:
        - default
        - e6data
        - monitoring
        - ingress
      pods_per_namespace: 5
    - name: dev-eks
      nodes:
        - ip-10-1-1-201
        - ip-10-1-2-202
      namespaces:
        - default
        - e6data
        - testing
      pods_per_namespace: 3

  # RDS Instances
  rds_instances:
    - identifier: prod-mysql-primary
      engine: mysql
      class: db.r5.2xlarge
      storage_gb: 500
    - identifier: prod-mysql-replica
      engine: mysql
      class: db.r5.xlarge
      storage_gb: 500
    - identifier: prod-postgres
      engine: postgres
      class: db.r5.xlarge
      storage_gb: 200
    - identifier: analytics-postgres
      engine: postgres
      class: db.r5.4xlarge
      storage_gb: 1000

  # S3 Buckets
  s3_buckets:
    - name: data-lake-prod
      storage_class: STANDARD
    - name: logs-archive
      storage_class: GLACIER
    - name: backups-daily
      storage_class: STANDARD_IA
    - name: static-assets-cdn
      storage_class: STANDARD
    - name: artifacts-ci
      storage_class: STANDARD

  # MSK Clusters
  msk_clusters:
    - name: prod-kafka
      brokers:
        - b-1
        - b-2
        - b-3
      topics:
        - events
        - logs
        - metrics
        - orders
        - notifications
    - name: dev-kafka
      brokers:
        - b-1
        - b-2
      topics:
        - events
        - logs
        - test-topic

  # Glue Jobs
  glue_jobs:
    - name: etl-daily-transform
      type: glueetl
    - name: data-catalog-crawler
      type: pythonshell
    - name: schema-migration
      type: glueetl
    - name: parquet-optimizer
      type: glueetl

  # VPCs
  vpcs:
    - id: vpc-prod-001
      subnets:
        - subnet-pub-1
        - subnet-pub-2
        - subnet-priv-1
        - subnet-priv-2
    - id: vpc-dev-001
      subnets:
        - subnet-pub-1
        - subnet-priv-1
    - id: vpc-shared-001
      subnets:
        - subnet-pub-1
        - subnet-priv-1
        - subnet-priv-2

# Vantage Configuration
vantage:
  providers:
    - aws
    - azure
    - gcp
    - databricks
    - snowflake

  base_daily_costs:
    aws: 15000
    azure: 8000
    gcp: 6000
    databricks: 4000
    snowflake: 3000

  accounts:
    aws:
      - account_id: "123456789012"
        account_name: Production
      - account_id: "234567890123"
        account_name: Development
      - account_id: "345678901234"
        account_name: Staging
    azure:
      - account_id: sub-prod-001
        account_name: Azure Production
      - account_id: sub-dev-001
        account_name: Azure Development
    gcp:
      - account_id: e6data-prod
        account_name: GCP Production
      - account_id: e6data-dev
        account_name: GCP Development
    databricks:
      - account_id: db-workspace-1
        account_name: Databricks Analytics
    snowflake:
      - account_id: sf-account-1
        account_name: Snowflake DW

  services:
    aws:
      - Amazon EC2
      - Amazon S3
      - Amazon RDS
      - AWS Lambda
      - Amazon EKS
      - Amazon CloudWatch
      - AWS Data Transfer
    azure:
      - Virtual Machines
      - Storage
      - Azure SQL
      - Azure Functions
      - AKS
    gcp:
      - Compute Engine
      - Cloud Storage
      - BigQuery
      - Cloud Functions
      - GKE
    databricks:
      - All-Purpose Compute
      - Jobs Compute
      - SQL Compute
      - Serverless
    snowflake:
      - Compute
      - Storage
      - Data Transfer

  tags:
    - tag_key: Environment
      values:
        - production
        - staging
        - development
        - __untagged__
    - tag_key: Team
      values:
        - platform
        - data-engineering
        - ml-ops
        - devops
        - __untagged__
    - tag_key: App
      values:
        - e6data
        - analytics
        - ingestion
        - monitoring
        - __untagged__
    - tag_key: Project
      values:
        - cloudcosts
        - laminar
        - core
        - __untagged__
    - tag_key: CostCenter
      values:
        - engineering
        - infrastructure
        - research
        - __untagged__

# Data generation settings
settings:
  historical_days:
    vantage: 90
    cloudwatch: 7
    kubernetes: 1
  scrape_interval_seconds: 60
