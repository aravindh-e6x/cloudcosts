apiVersion: v2
name: monitoring-stack
description: Central monitoring stack with GreptimeDB and Grafana
type: application
version: 0.3.0
appVersion: "1.0.0"

dependencies:
  - name: greptimedb-standalone
    version: "0.3.1"
    repository: https://greptimeteam.github.io/helm-charts/
  - name: grafana
    version: "8.8.2"
    repository: https://grafana.github.io/helm-charts
  - name: ingress-nginx
    version: "4.12.2"
    repository: https://kubernetes.github.io/ingress-nginx
  - name: cert-manager
    version: "1.16.2"
    repository: https://charts.jetstack.io
