version: '3'

dotenv: ['.env']

vars:
  CLUSTER_NAME: cloudcosts
  NAMESPACE: cloudcosts-cluster
  RELEASE_NAME: cloudcosts-cluster

tasks:
  up:
    desc: Build images and install helm chart
    cmds:
      - task: build
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - envsubst < values-k3d.yaml | helm install {{.RELEASE_NAME}} . -n {{.NAMESPACE}} -f -

  down:
    desc: Uninstall helm chart
    cmds:
      - helm uninstall {{.RELEASE_NAME}} -n {{.NAMESPACE}} || true
      - kubectl delete namespace {{.NAMESPACE}} --ignore-not-found

  upgrade:
    desc: Build images and upgrade helm chart
    cmds:
      - task: build
      - envsubst < values-k3d.yaml | helm upgrade {{.RELEASE_NAME}} . -n {{.NAMESPACE}} -f -

  build:
    desc: Build and load images into k3d
    cmds:
      - docker build -t cloudcosts/dashboard:latest ../dashboard
      - k3d image import cloudcosts/dashboard:latest -c {{.CLUSTER_NAME}}

  reset-db:
    desc: Reset GreptimeDB (delete all e6_ databases and recreate)
    vars:
      GREPTIMEDB_URL: '{{.GREPTIMEDB_URL | default "https://greptimedb.cloudcosts.local"}}'
    cmds:
      - |
        dbs=$(curl -s -u "${GREPTIMEDB_USERNAME}:${GREPTIMEDB_PASSWORD}" -X POST \
          "{{.GREPTIMEDB_URL}}/v1/sql?db=public" \
          -d "sql=SHOW DATABASES" | jq -r '.output[0].records.rows[][0]' | grep '^e6_' || true)
        for db in $dbs; do
          echo "Dropping $db..."
          curl -s -u "${GREPTIMEDB_USERNAME}:${GREPTIMEDB_PASSWORD}" -X POST \
            "{{.GREPTIMEDB_URL}}/v1/sql?db=public" \
            -d "sql=DROP DATABASE IF EXISTS ${db}"
        done
      - kubectl delete statefulset {{.RELEASE_NAME}}-greptimedb-standalone -n {{.NAMESPACE}} --ignore-not-found
      - kubectl delete pvc -l app.kubernetes.io/name=greptimedb-standalone -n {{.NAMESPACE}} --ignore-not-found
      - task: upgrade
