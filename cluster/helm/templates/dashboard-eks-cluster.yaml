{{- if .Values.grafanaDashboards.eksCluster.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-dashboard-eks-cluster
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  eks-cluster.json: |-
{{ .Files.Get "grafana/dashboards/eks-cluster.json" | indent 4 }}
{{- end }}
