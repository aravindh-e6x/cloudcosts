{{- if .Values.grafanaDashboards.pocCosts.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-dashboard-poc-costs
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  poc-costs.json: |-
{{ .Files.Get "grafana/dashboards/poc-costs.json" | indent 4 }}
{{- end }}
