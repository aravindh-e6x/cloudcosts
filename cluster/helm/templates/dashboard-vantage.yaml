{{- if .Values.grafanaDashboards.vantage.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-dashboard-vantage
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  vantage.json: |-
{{ .Files.Get "grafana/dashboards/vantage.json" | indent 4 }}
{{- end }}
