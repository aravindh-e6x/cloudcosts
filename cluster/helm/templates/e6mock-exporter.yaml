{{- if .Values.e6mockExporter.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-mock-exporter-config
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mock-exporter
data:
  config.yaml: |
    workspaces:
      {{- toYaml .Values.e6mockExporter.workspaces | nindent 6 }}

    generation:
      interval_minutes: {{ .Values.e6mockExporter.generation.intervalMinutes }}

    greptimedb:
      host: {{ .Values.e6mockExporter.greptimedb.host }}
      port: {{ .Values.e6mockExporter.greptimedb.port }}
      user: {{ .Values.global.greptimedb.username }}
      password: {{ .Values.global.greptimedb.password }}

    databases:
      kubernetes: {{ .Values.e6mockExporter.databases.kubernetes }}
      e6_prefix: {{ .Values.e6mockExporter.databases.e6Prefix }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-mock-exporter
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mock-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "monitoring-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mock-exporter
  template:
    metadata:
      annotations:
        checksum/config: {{ .Values.e6mockExporter | toYaml | sha256sum }}
      labels:
        {{- include "monitoring-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mock-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mock-exporter
          image: "{{ .Values.e6mockExporter.image.repository }}:{{ .Values.e6mockExporter.image.tag }}"
          imagePullPolicy: {{ .Values.e6mockExporter.image.pullPolicy | default "IfNotPresent" }}
          args:
            - "--config"
            - "/config/config.yaml"
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            {{- toYaml .Values.e6mockExporter.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "monitoring-stack.fullname" . }}-mock-exporter-config
{{- end }}
