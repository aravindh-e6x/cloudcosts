{{- if .Values.greptimeIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-greptimedb
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: greptimedb
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- with .Values.greptimeIngress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.greptimeIngress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.greptimeIngress.host }}
      secretName: {{ .Values.greptimeIngress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.greptimeIngress.host | required "greptimeIngress.host is required" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-greptimedb-standalone
                port:
                  number: 4000
{{- end }}
