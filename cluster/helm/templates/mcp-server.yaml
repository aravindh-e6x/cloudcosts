{{- if .Values.mcpServer.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mcp-server
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
type: Opaque
data:
  greptimedb_username: {{ .Values.mcpServer.greptimedb.username | b64enc | quote }}
  greptimedb_password: {{ .Values.mcpServer.greptimedb.password | b64enc | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-mcp-server
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "monitoring-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-server
  template:
    metadata:
      labels:
        {{- include "monitoring-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: mcp-server
          image: "{{ .Values.mcpServer.image.repository }}:{{ .Values.mcpServer.image.tag }}"
          imagePullPolicy: {{ .Values.mcpServer.image.pullPolicy }}
          env:
            - name: GREPTIMEDB_URL
              value: {{ .Values.mcpServer.greptimedb.url | quote }}
            - name: GREPTIMEDB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mcp-server
                  key: greptimedb_username
            - name: GREPTIMEDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mcp-server
                  key: greptimedb_password
          resources:
            {{- toYaml .Values.mcpServer.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
      {{- with .Values.mcpServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mcpServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-mcp-server
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
spec:
  type: ClusterIP
  selector:
    {{- include "monitoring-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-server
  ports:
    - name: mcp
      port: 8080
      targetPort: 8080
      protocol: TCP
{{- end }}
