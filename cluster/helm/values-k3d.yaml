global:
  imagePullSecrets: []
  greptimedb:
    url: "http://monitoring-stack-greptimedb-standalone:4000"
    username: "${GREPTIMEDB_USERNAME}"
    password: "${GREPTIMEDB_PASSWORD}"

cluster:
  name: k3d-cloudcosts

grafanaIngress:
  enabled: true
  host: grafana.cloudcosts.local
  tls:
    enabled: false

greptimeIngress:
  enabled: true
  host: greptimedb.cloudcosts.local
  tls:
    enabled: false

certManager:
  clusterIssuer:
    enabled: false

cert-manager:
  enabled: false

ingress-nginx:
  controller:
    hostPort:
      enabled: true
    service:
      type: ClusterIP

greptimedb-standalone:
  image:
    registry: docker.io
    repository: greptime/greptimedb
    tag: "v1.0.0-beta.2"
    pullPolicy: IfNotPresent
  objectStorage:
    s3: null
  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi
  serviceAccount:
    create: true
    annotations: {}
  auth:
    enabled: true
    users:
      - username: "${GREPTIMEDB_USERNAME}"
        password: "${GREPTIMEDB_PASSWORD}"
        permission: "readwrite"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  service:
    type: ClusterIP

grafana:
  replicas: 1
  deploymentStrategy:
    type: Recreate
  adminUser: "${GRAFANA_ADMIN_USER}"
  adminPassword: "${GRAFANA_ADMIN_PASSWORD}"
  initChownData:
    image:
      repository: busybox
      tag: "1.31.1"
  image:
    repository: grafana/grafana
  sidecar:
    image:
      repository: quay.io/kiwigrid/k8s-sidecar
  persistence:
    enabled: true
    size: 1Gi
  serviceAccount:
    create: true
    annotations: {}
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: GreptimeDB
          uid: greptimedb
          type: prometheus
          url: http://monitoring-stack-greptimedb-standalone:4000/v1/prometheus
          access: proxy
          isDefault: true
          basicAuth: true
          basicAuthUser: "${GREPTIMEDB_USERNAME}"
          secureJsonData:
            basicAuthPassword: "${GREPTIMEDB_PASSWORD}"
            httpHeaderValue1: kubernetes
          jsonData:
            timeInterval: "15s"
            httpHeaderName1: x-greptime-db-name
        - name: GreptimeDB-Vantage
          uid: greptimedb-vantage
          type: prometheus
          url: http://monitoring-stack-greptimedb-standalone:4000/v1/prometheus
          access: proxy
          basicAuth: true
          basicAuthUser: "${GREPTIMEDB_USERNAME}"
          secureJsonData:
            basicAuthPassword: "${GREPTIMEDB_PASSWORD}"
            httpHeaderValue1: vantage
          jsonData:
            timeInterval: "1h"
            httpHeaderName1: x-greptime-db-name
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      folder: /tmp/dashboards
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
        allowUiUpdates: true
    datasources:
      enabled: true
      label: grafana_datasource
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

cloudwatchExporter:
  enabled: false

vantageExporter:
  enabled: false

e6metricsExporter:
  enabled: false

dashboard:
  enabled: true
  image:
    repository: cloudcosts/dashboard
    tag: "latest"
    pullPolicy: Never
  auth:
    secret: "${DASHBOARD_AUTH_SECRET}"
    username: "${DASHBOARD_AUTH_USERNAME}"
    password: "${DASHBOARD_AUTH_PASSWORD}"
  anthropicApiKey: "${ANTHROPIC_API_KEY}"
  ingress:
    enabled: true
    host: dashboard.cloudcosts.local
    tls:
      enabled: false


