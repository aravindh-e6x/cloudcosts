# Monitoring Stack Values

# Global Configuration
global:
  clusterName: k3s-cloudcosts
  awsRegion: ${AWS_REGION}
  awsAccountId: ${AWS_PRIMARY_ACCOUNT_ID}

  # ECR registry prefix for custom images
  imageRegistry: "${AWS_PRIMARY_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/cloudcosts"
  imagePullPolicy: Always
  imagePullSecrets:
    - name: ecr-pull-secret

  # GreptimeDB connection (shared across exporters)
  greptimedb:
    url: "http://monitoring-stack-greptimedb-standalone.monitoring.svc:4000"
    username: "${GREPTIMEDB_USERNAME}"
    password: "${GREPTIMEDB_PASSWORD}"

# cert-manager Configuration
certManager:
  email: ${LETSENCRYPT_EMAIL}
  clusterIssuer:
    enabled: true

cert-manager:
  installCRDs: true

# Nginx Ingress Controller
ingress-nginx:
  controller:
    hostPort:
      enabled: true
    service:
      type: ClusterIP

# GreptimeDB Standalone
greptimedb-standalone:
  image:
    tag: "v1.0.0-beta.2"
  persistence:
    enabled: true
    size: 50Gi
  objectStorage:
    s3:
      bucket: ${GREPTIMEDB_S3_BUCKET}
      region: ${AWS_REGION}
      root: greptimedb
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_PRIMARY_ACCOUNT_ID}:role/greptimedb-s3-role
  auth:
    enabled: true
    users:
      - username: "${GREPTIMEDB_USERNAME}"
        password: "${GREPTIMEDB_PASSWORD}"
        permission: "readwrite"
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: 1500m
      memory: 4Gi

# Grafana
grafana:
  adminUser: ${GRAFANA_ADMIN_USERNAME}
  adminPassword: ${GRAFANA_ADMIN_PASSWORD}
  persistence:
    enabled: true
    size: 5Gi
  serviceAccount:
    create: true
    annotations:
      eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_PRIMARY_ACCOUNT_ID}:role/grafana-cloudwatch-role
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: GreptimeDB
          uid: greptimedb
          type: prometheus
          url: http://monitoring-stack-greptimedb-standalone.monitoring.svc:4000/v1/prometheus
          isDefault: true
          basicAuth: true
          basicAuthUser: ${GREPTIMEDB_USERNAME}
          secureJsonData:
            basicAuthPassword: ${GREPTIMEDB_PASSWORD}
            httpHeaderValue1: kubernetes
          jsonData:
            timeInterval: "15s"
            httpHeaderName1: x-greptime-db-name
        - name: GreptimeDB-Vantage
          uid: greptimedb-vantage
          type: prometheus
          url: http://monitoring-stack-greptimedb-standalone.monitoring.svc:4000/v1/prometheus
          basicAuth: true
          basicAuthUser: ${GREPTIMEDB_USERNAME}
          secureJsonData:
            basicAuthPassword: ${GREPTIMEDB_PASSWORD}
            httpHeaderValue1: vantage
          jsonData:
            timeInterval: "1h"
            httpHeaderName1: x-greptime-db-name
        - name: CloudWatch
          uid: cloudwatch
          type: cloudwatch
          jsonData:
            authType: default
            defaultRegion: ${AWS_REGION}
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
    datasources:
      enabled: true
      label: grafana_datasource
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Grafana Ingress
grafanaIngress:
  enabled: true
  host: ${GRAFANA_INGRESS_HOST}
  tls:
    enabled: true
    secretName: grafana-tls

# GreptimeDB Ingress
greptimeIngress:
  enabled: true
  host: ${GREPTIMEDB_INGRESS_HOST}
  tls:
    enabled: true
    secretName: greptimedb-tls

# CloudWatch Exporter (Alloy)
cloudwatchExporter:
  enabled: true
  serviceAccount:
    roleArn: "arn:aws:iam::${AWS_PRIMARY_ACCOUNT_ID}:role/alloy-cloudwatch-role"
  accounts:
    - name: "primary"
      accountId: "${AWS_PRIMARY_ACCOUNT_ID}"
      regions: ["${AWS_REGION}"]
    - name: "perfadmin"
      accountId: "${CLOUDWATCH_ACCOUNT_PERFADMIN}"
      regions: ["${AWS_REGION}"]
      roleArn: "arn:aws:iam::${CLOUDWATCH_ACCOUNT_PERFADMIN}:role/cloudwatch-exporter-role"
    - name: "preprod"
      accountId: "${CLOUDWATCH_ACCOUNT_PREPROD}"
      regions: ["${AWS_REGION}"]
      roleArn: "arn:aws:iam::${CLOUDWATCH_ACCOUNT_PREPROD}:role/cloudwatch-exporter-role"
    - name: "serverless_prod"
      accountId: "${CLOUDWATCH_ACCOUNT_SERVERLESS_PROD}"
      regions: ["${AWS_REGION}"]
      roleArn: "arn:aws:iam::${CLOUDWATCH_ACCOUNT_SERVERLESS_PROD}:role/cloudwatch-exporter-role"
    - name: "serverless_beta"
      accountId: "${CLOUDWATCH_ACCOUNT_SERVERLESS_BETA}"
      regions: ["${AWS_REGION}"]
      roleArn: "arn:aws:iam::${CLOUDWATCH_ACCOUNT_SERVERLESS_BETA}:role/cloudwatch-exporter-role"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Vantage Exporter
vantageExporter:
  enabled: true
  image:
    tag: "latest"
  apiToken: "${VANTAGE_API_TOKEN}"
  database: "vantage"
  pushInterval: "3600"
  historicalDays: "90"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# E6 Metrics Exporter
e6metricsExporter:
  enabled: true
  image:
    tag: "latest"
  grafana:
    url: "${E6METRICS_GRAFANA_URL}"
    username: "${E6METRICS_GRAFANA_USERNAME}"
    password: "${E6METRICS_GRAFANA_PASSWORD}"
  customers:
    - name: "dev-zepto"
      datasourceId: 22
      database: "e6_dev_zepto"
      scrapeInterval: 300
    - name: "kantar"
      datasourceId: 34
      database: "e6_kantar"
      scrapeInterval: 300
    - name: "tekion"
      datasourceId: 26
      database: "e6_tekion"
      scrapeInterval: 300
    - name: "cndata"
      datasourceId: 8
      database: "e6_cndata"
      scrapeInterval: 300
    - name: "cisco-sal"
      datasourceId: 4
      database: "e6_cisco_sal"
      scrapeInterval: 300
    - name: "swiggy"
      datasourceId: 44
      database: "e6_swiggy"
      scrapeInterval: 300
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# E6 Mock Exporter
e6mockExporter:
  enabled: false
  image:
    tag: "latest"
  database: "e6_mock"
  scrapeInterval: "60"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Dashboard
dashboard:
  enabled: true
  image:
    tag: "latest"
  auth:
    secret: "${DASHBOARD_AUTH_SECRET}"
    username: "${DASHBOARD_AUTH_USERNAME}"
    password: "${DASHBOARD_AUTH_PASSWORD}"
  ingress:
    enabled: true
    host: dashboard.cloudcosts.in
    tls:
      enabled: true
      secretName: dashboard-tls
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Grafana Dashboards (ConfigMaps)
grafanaDashboards:
  vantage:
    enabled: true
  eksCluster:
    enabled: true
  pocCosts:
    enabled: true
