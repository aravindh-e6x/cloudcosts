workspaces:
  - name: condenast
    eks_cluster: condenast-prod-eks
    region: us-east-1
    account_id: "123456789012"
    e6_clusters:
      - analytics
      - reporting

  - name: cisco
    eks_cluster: cisco-prod-eks
    region: eu-west-1
    account_id: "234567890123"
    e6_clusters:
      - emea
      - apac

  - name: freshworks
    eks_cluster: freshworks-eks
    region: us-west-2
    account_id: "345678901234"
    e6_clusters:
      - prod

  - name: swiggy
    eks_cluster: swiggy-eks
    region: ap-south-1
    account_id: "456789012345"
    e6_clusters:
      - main
      - batch
      - realtime

generation:
  start_date: "2024-12-01"
  end_date: "2024-12-26"
  interval_minutes: 5

greptimedb:
  host: localhost
  port: 4000
  user: e6data
  password: cloudcosts

databases:
  kubernetes: kubernetes          # K8s metrics (OpenCost, KSM, cAdvisor)
  e6_prefix: e6_                  # E6 metrics go to e6_{customer} (e6_condenast, e6_cisco, etc.)
