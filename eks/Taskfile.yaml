version: '3'

tasks:
  create:
    desc: Create EKS cluster
    cmds:
      - envsubst < cluster.yaml > /tmp/cluster-resolved.yaml
      - eksctl create cluster -f /tmp/cluster-resolved.yaml

  delete:
    desc: Delete EKS cluster
    cmds:
      - envsubst < cluster.yaml > /tmp/cluster-resolved.yaml
      - eksctl delete cluster -f /tmp/cluster-resolved.yaml

  dry-run:
    desc: Dry run cluster creation (validate config)
    cmds:
      - envsubst < cluster.yaml > /tmp/cluster-resolved.yaml
      - eksctl create cluster -f /tmp/cluster-resolved.yaml --dry-run

  get-oidc:
    desc: Get OIDC provider ID for the cluster
    cmds:
      - |
        aws eks describe-cluster --name ${EKS_CLUSTER_NAME} --region ${AWS_REGION} \
          --query "cluster.identity.oidc.issuer" --output text | cut -d'/' -f5
