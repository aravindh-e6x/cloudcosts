version: '3'

vars:
  STACK_NAME: k3s-cloudcosts
  REGION: us-east-1

tasks:
  create:
    desc: Create k3s cluster via CloudFormation
    cmds:
      - |
        aws cloudformation create-stack \
          --stack-name {{.STACK_NAME}} \
          --template-body file://cloudformation.yaml \
          --capabilities CAPABILITY_NAMED_IAM \
          --region {{.REGION}}
      - echo "Waiting for stack creation..."
      - aws cloudformation wait stack-create-complete --stack-name {{.STACK_NAME}} --region {{.REGION}}
      - task: get-outputs

  delete:
    desc: Delete k3s cluster
    cmds:
      - aws cloudformation delete-stack --stack-name {{.STACK_NAME}} --region {{.REGION}}
      - echo "Waiting for stack deletion..."
      - aws cloudformation wait stack-delete-complete --stack-name {{.STACK_NAME}} --region {{.REGION}}

  get-outputs:
    desc: Get stack outputs
    cmds:
      - aws cloudformation describe-stacks --stack-name {{.STACK_NAME}} --region {{.REGION}} --query 'Stacks[0].Outputs' --output table

  get-kubeconfig:
    desc: Download kubeconfig from k3s node and set context
    cmds:
      - |
        IP=$(aws cloudformation describe-stacks --stack-name {{.STACK_NAME}} --region {{.REGION}} \
          --query 'Stacks[0].Outputs[?OutputKey==`PublicIP`].OutputValue' --output text)
        kubectl config delete-context k3s-cloudcosts 2>/dev/null || true
        kubectl config delete-cluster k3s-cloudcosts 2>/dev/null || true
        kubectl config delete-user k3s-cloudcosts 2>/dev/null || true
        ssh -i ~/.ssh/ingestion-ec2-instances.pem ec2-user@$IP "sudo cat /etc/rancher/k3s/k3s.yaml" | \
          sed "s/127.0.0.1/$IP/g" | \
          sed "s/default/k3s-cloudcosts/g" > /tmp/k3s-cloudcosts.yaml
        KUBECONFIG=~/.kube/config:/tmp/k3s-cloudcosts.yaml kubectl config view --flatten > /tmp/merged-config.yaml
        mv /tmp/merged-config.yaml ~/.kube/config
        kubectl config use-context k3s-cloudcosts
        rm -f /tmp/k3s-cloudcosts.yaml
        echo "Context switched to k3s-cloudcosts"

  ssh:
    desc: SSH into k3s node
    cmds:
      - |
        IP=$(aws cloudformation describe-stacks --stack-name {{.STACK_NAME}} --region {{.REGION}} \
          --query 'Stacks[0].Outputs[?OutputKey==`PublicIP`].OutputValue' --output text)
        ssh -i ~/.ssh/ingestion-ec2-instances.pem ec2-user@$IP

  status:
    desc: Check CloudFormation stack status
    cmds:
      - aws cloudformation describe-stacks --stack-name {{.STACK_NAME}} --region {{.REGION}} --query 'Stacks[0].StackStatus' --output text
