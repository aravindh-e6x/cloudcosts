[project]
name = "cloudcosts-mcp"
version = "0.1.0"
description = "MCP server for querying CloudCosts metrics from GreptimeDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
cloudcosts-mcp = "cloudcosts_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudcosts_mcp"]
