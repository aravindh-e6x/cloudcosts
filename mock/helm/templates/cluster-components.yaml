spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mock-e6.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: queue
      e6.io/cluster: {{ $cluster.name }}
  template:
    metadata:
      labels:
        {{- include "mock-e6.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: queue
        e6.io/component: queue
        e6.io/cluster: {{ $cluster.name }}
        e6.io/workspace: {{ $workspace }}
      annotations:
        {{- toYaml $.Values.podAnnotations | nindent 8 }}
    spec:
      containers:
        - name: queue
          image: {{ $image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: E6_COMPONENT
              value: queue
            - name: E6_CLUSTER
              value: {{ $cluster.name }}
            - name: E6_WORKSPACE
