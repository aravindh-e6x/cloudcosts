---
# Queue Service
apiVersion: v1
kind: Service
metadata:
  name: queue-{{ $cluster.name }}
  namespace: {{ $cluster.name }}
  labels:
    {{- include "mock-e6.labels" $ | nindent 4 }}
    app.kubernetes.io/component: queue
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: metrics
      name: metrics
  selector:
    {{- include "mock-e6.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: queue
    e6.io/cluster: {{ $cluster.name }}
{{- end }}
