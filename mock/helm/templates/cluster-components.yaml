            - name: E6_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: E6_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: E6_BASE_QPM
