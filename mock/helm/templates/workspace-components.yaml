{{- $workspace := .Values.workspace.name }}
{{- $image := printf "%s:%s" .Values.image.repository .Values.image.tag }}
{{- $baseQpm := .Values.baseQpm }}
{{- $updateInterval := .Values.updateInterval }}

{{- range $component, $config := .Values.workspaceComponents }}
{{- if $config.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $component }}-{{ $workspace }}
  namespace: {{ $workspace }}
  labels:
    {{- include "mock-e6.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
    e6.io/workspace: {{ $workspace }}
spec:
  replicas: {{ $config.replicas }}
  selector:
    matchLabels:
      {{- include "mock-e6.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "mock-e6.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        e6.io/component: {{ $component }}
        e6.io/workspace: {{ $workspace }}
      annotations:
        {{- toYaml $.Values.podAnnotations | nindent 8 }}
    spec:
      containers:
        - name: {{ $component }}
          image: {{ $image }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          env:
            - name: E6_COMPONENT
              value: {{ $component }}
            - name: E6_CLUSTER
              value: {{ $workspace }}
            - name: E6_WORKSPACE
              value: {{ $workspace }}
            - name: E6_NAMESPACE
              value: {{ $workspace }}
            - name: E6_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: E6_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: E6_BASE_QPM
              value: {{ $baseQpm | quote }}
            - name: E6_UPDATE_INTERVAL
              value: {{ $updateInterval | quote }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $component }}-{{ $workspace }}
  namespace: {{ $workspace }}
  labels:
    {{- include "mock-e6.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "mock-e6.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
{{- end }}
{{- end }}
