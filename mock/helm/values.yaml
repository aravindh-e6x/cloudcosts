# Service Monitor for Prometheus scraping (requires Prometheus Operator CRDs)
serviceMonitor:
  enabled: false
  interval: 15s
  labels: {}

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
