# Mock E6 Components Configuration

image:
  repository: mock-e6
  tag: latest
  pullPolicy: Never

# Workspace configuration
workspace:
  name: demo

# Base queries per minute (affects all components)
baseQpm: 100

# Metric update interval in seconds
updateInterval: 15

# Workspace-level components (deployed in workspace namespace)
workspaceComponents:
  gateway:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  schema:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  storage:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# E6 clusters (each cluster gets executor, planner, queue)
clusters:
  - name: analytics
    executors: 3
    resources:
      executor:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      planner:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      queue:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

  - name: reporting
    executors: 2
    resources:
      executor:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      planner:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      queue:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

  - name: batch
    executors: 5
    resources:
      executor:
        requests:
          cpu: 300m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
      planner:
        requests:
          cpu: 150m
          memory: 256Mi
        limits:
          cpu: 300m
          memory: 512Mi
      queue:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

  - name: realtime
