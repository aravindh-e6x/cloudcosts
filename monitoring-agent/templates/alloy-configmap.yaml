apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-alloy
  labels:
    {{- include "monitoring-agent.labels" . | nindent 4 }}
data:
  config.alloy: |
    // =============================================================================
    // Monitoring Agent - Alloy Configuration
    // Cluster: {{ .Values.cluster.name }}
    // =============================================================================

    // Scrape kube-state-metrics
    prometheus.scrape "kube_state_metrics" {
      targets = [{
        __address__ = "{{ .Release.Name }}-kube-state-metrics.{{ .Release.Namespace }}.svc:8080",
      }]
      forward_to = [prometheus.relabel.cost_metrics.receiver]
      scrape_interval = "30s"
      job_name = "kube-state-metrics"
    }

    // Scrape node-exporter
    discovery.kubernetes "nodes" {
      role = "node"
    }

    discovery.relabel "node_exporter" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        replacement = "{{ .Release.Name }}-prometheus-node-exporter.{{ .Release.Namespace }}.svc:9100"
        target_label = "__address__"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label = "node"
      }
    }

    prometheus.scrape "node_exporter" {
      targets = discovery.relabel.node_exporter.output
      forward_to = [prometheus.relabel.cost_metrics.receiver]
      scrape_interval = "30s"
      job_name = "node-exporter"
    }

    // Scrape pods with prometheus.io/scrape annotation
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
        regex = "true"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scheme"]
        regex = "(https?)"
        target_label = "__scheme__"
        replacement = "$1"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
        regex = "(.+)"
        target_label = "__metrics_path__"
        replacement = "$1"
      }
      rule {
        source_labels = ["__address__", "__meta_kubernetes_pod_annotation_prometheus_io_port"]
        regex = "([^:]+)(?:\\d+)?;(\\d+)"
        target_label = "__address__"
        replacement = "$1:$2"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label = "node"
      }
    }

    prometheus.scrape "pods" {
      targets = discovery.relabel.pods.output
      forward_to = [prometheus.relabel.cost_metrics.receiver]
      scrape_interval = "30s"
      job_name = "kubernetes-pods"
    }

    // Scrape kubelet metrics
    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__address__"
        replacement = "kubernetes.default.svc:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex = "(.+)"
        target_label = "__metrics_path__"
        replacement = "/api/v1/nodes/$1/proxy/metrics"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label = "node"
      }
    }

    prometheus.scrape "kubelet" {
      targets = discovery.relabel.kubelet.output
      forward_to = [prometheus.relabel.cost_metrics.receiver]
      scrape_interval = "30s"
      job_name = "kubelet"
      scheme = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
    }

    // Scrape cAdvisor metrics
    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__address__"
        replacement = "kubernetes.default.svc:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex = "(.+)"
        target_label = "__metrics_path__"
        replacement = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label = "node"
      }
    }

    prometheus.scrape "cadvisor" {
      targets = discovery.relabel.cadvisor.output
      forward_to = [prometheus.relabel.cost_metrics.receiver]
      scrape_interval = "30s"
      job_name = "cadvisor"
      scheme = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
    }

    // Scrape OpenCost metrics
    prometheus.scrape "opencost" {
      targets = [{
        __address__ = "{{ .Release.Name }}-opencost.{{ .Release.Namespace }}.svc:9003",
      }]
      forward_to = [prometheus.relabel.cost_metrics.receiver]
      scrape_interval = "30s"
      job_name = "opencost"
      metrics_path = "/metrics"
    }

    // =============================================================================
    // Metric Routing - Route metrics to separate schemas
    // =============================================================================

    // Filter and forward all metrics to single kubernetes schema
    prometheus.relabel "cost_metrics" {
      forward_to = [prometheus.remote_write.greptimedb_kubernetes.receiver]

      // Keep only the metrics we need (drop everything else)
      // Categories:
      //   - Container metrics: CPU/memory usage and allocation
      //   - Pod metrics: info, labels, status, owner, PVC allocation
      //   - Node metrics: info, labels, capacity, allocatable, status, cost
      //   - OpenCost metrics: all opencost_* and node cost breakdown
      //   - Disk/Network metrics: filesystem and network stats
      rule {
        source_labels = ["__name__"]
        regex = "container_cpu_usage_seconds_total|container_memory_working_set_bytes|container_cpu_allocation|container_memory_allocation_bytes|container_gpu_allocation|container_fs_usage_bytes|container_network_receive_bytes_total|container_network_transmit_bytes_total|kube_pod_container_resource_requests|kube_pod_container_resource_limits|kube_pod_info|kube_pod_labels|kube_pod_status_phase|kube_pod_owner|kube_pod_created|kube_pod_start_time|kube_pod_container_status_running|kube_pod_container_status_waiting|kube_pod_container_status_terminated|pod_pvc_allocation|node_cpu_seconds_total|node_memory_MemTotal_bytes|node_memory_MemAvailable_bytes|node_filesystem_size_bytes|node_filesystem_avail_bytes|node_network_receive_bytes_total|node_network_transmit_bytes_total|kube_node_status_capacity|kube_node_status_allocatable|kube_node_status_condition|kube_node_labels|kube_node_info|kube_namespace_labels|kube_resourcequota|kube_deployment_status_replicas|kube_deployment_status_replicas_available|kube_deployment_spec_replicas|kube_statefulset_status_replicas|kube_statefulset_replicas|opencost_.*|node_total_hourly_cost|node_cpu_hourly_cost|node_ram_hourly_cost|node_gpu_hourly_cost|pv_hourly_cost"
        action = "keep"
      }
    }

    // =============================================================================
    // Remote Write Endpoint - Single kubernetes schema
    // =============================================================================

    prometheus.remote_write "greptimedb_kubernetes" {
      endpoint {
        url = "{{ .Values.greptimedb.urlBase }}/v1/prometheus/write?db=kubernetes"
        basic_auth {
          username = "{{ .Values.greptimedb.username }}"
          password = "{{ .Values.greptimedb.password }}"
        }
      }
      external_labels = {
        cluster = "{{ .Values.cluster.name }}",
      }
    }

    // =============================================================================
    // Exporter Heartbeat - Self-monitoring metrics
    // =============================================================================
    prometheus.exporter.self "monitoring_agent" {}

    prometheus.scrape "alloy_self" {
      targets    = prometheus.exporter.self.monitoring_agent.targets
      forward_to = [prometheus.relabel.heartbeat.receiver]
      scrape_interval = "1m"
      job_name = "monitoring-agent-self"
    }

    prometheus.relabel "heartbeat" {
      forward_to = [prometheus.remote_write.greptimedb_system.receiver]

      // Keep only up metric
      rule {
        source_labels = ["__name__"]
        regex = "up"
        action = "keep"
      }
      rule {
        target_label = "exporter"
        replacement = "monitoring-agent"
      }
    }

    prometheus.remote_write "greptimedb_system" {
      endpoint {
        url = "{{ .Values.greptimedb.urlBase }}/v1/prometheus/write?db=system"
        basic_auth {
          username = "{{ .Values.greptimedb.username }}"
          password = "{{ .Values.greptimedb.password }}"
        }
      }
      external_labels = {
        cluster = "{{ .Values.cluster.name }}",
      }
    }

