apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-init
  labels:
    {{- include "monitoring-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: db-init
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Creating database 'kubernetes' if not exists..."
              curl -s -X POST \
                -u "{{ .Values.greptimedb.username }}:{{ .Values.greptimedb.password }}" \
                "{{ .Values.greptimedb.urlBase }}/v1/sql" \
                -d "sql=CREATE DATABASE IF NOT EXISTS kubernetes"
              echo "Database initialization complete"
