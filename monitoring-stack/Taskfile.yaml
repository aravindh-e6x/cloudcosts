version: '3'

vars:
  RELEASE_NAME: monitoring-stack
  NAMESPACE: monitoring
  CHART_DIR: .

tasks:
  install:
    desc: Install the monitoring stack
    cmds:
      - envsubst < values.yaml > /tmp/values-resolved.yaml
      - helm dependency update {{.CHART_DIR}}
      - helm install {{.RELEASE_NAME}} {{.CHART_DIR}} -n {{.NAMESPACE}} --create-namespace -f /tmp/values-resolved.yaml

  upgrade:
    desc: Upgrade the monitoring stack
    cmds:
      - envsubst < values.yaml > /tmp/values-resolved.yaml
      - helm dependency update {{.CHART_DIR}}
      - helm upgrade {{.RELEASE_NAME}} {{.CHART_DIR}} -n {{.NAMESPACE}} -f /tmp/values-resolved.yaml

  clean-install:
    desc: Delete helm chart fully and reinstall from scratch
    cmds:
      - helm uninstall {{.RELEASE_NAME}} -n {{.NAMESPACE}} --wait || true
      - kubectl delete pvc -n {{.NAMESPACE}} -l app.kubernetes.io/instance={{.RELEASE_NAME}} --wait=false || true
      - sleep 5
      - task: install

  rollback:
    desc: Rollback to previous revision
    cmds:
      - helm rollback {{.RELEASE_NAME}} -n {{.NAMESPACE}}

  delete:
    desc: Delete the monitoring stack
    cmds:
      - helm uninstall {{.RELEASE_NAME}} -n {{.NAMESPACE}}

  status:
    desc: Show helm release status
    cmds:
      - helm status {{.RELEASE_NAME}} -n {{.NAMESPACE}}

  history:
    desc: Show helm release history
    cmds:
      - helm history {{.RELEASE_NAME}} -n {{.NAMESPACE}}

  logs:
    desc: Show logs from all pods
    cmds:
      - kubectl logs -n {{.NAMESPACE}} -l app.kubernetes.io/instance={{.RELEASE_NAME}} --all-containers --tail=50

  template:
    desc: Render helm templates locally (for debugging)
    cmds:
      - envsubst < values.yaml > /tmp/values-resolved.yaml
      - helm dependency update {{.CHART_DIR}}
      - helm template {{.RELEASE_NAME}} {{.CHART_DIR}} -n {{.NAMESPACE}} -f /tmp/values-resolved.yaml
