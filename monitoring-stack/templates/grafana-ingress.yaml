{{- if .Values.grafanaIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-grafana
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    {{- with .Values.grafanaIngress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: nginx
  {{- if .Values.grafanaIngress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.grafanaIngress.host }}
      secretName: {{ .Values.grafanaIngress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.grafanaIngress.host | required "grafanaIngress.host is required" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-grafana
                port:
                  number: 80
{{- end }}
