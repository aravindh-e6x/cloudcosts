{{- if .Values.grafanaIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-grafana
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  annotations:
    alb.ingress.kubernetes.io/scheme: {{ .Values.grafanaIngress.scheme | default "internet-facing" }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/success-codes: "200"
    {{- if .Values.grafanaIngress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.grafanaIngress.certificateArn }}
    {{- end }}
    {{- if .Values.grafanaIngress.groupName }}
    alb.ingress.kubernetes.io/group.name: {{ .Values.grafanaIngress.groupName }}
    {{- end }}
    {{- with .Values.grafanaIngress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    - host: {{ .Values.grafanaIngress.host | required "grafanaIngress.host is required" }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-grafana
                port:
                  number: 80
{{- end }}
