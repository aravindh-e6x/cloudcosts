{{- if .Values.pocCostExporter.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-poc-cost-exporter-config
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: poc-cost-exporter
data:
  config.yaml: |
    grafana:
      url: {{ .Values.pocCostExporter.grafana.url | quote }}
      username: {{ .Values.pocCostExporter.grafana.username | quote }}
      password: {{ .Values.pocCostExporter.grafana.password | quote }}
    greptimedb:
      url: {{ .Values.pocCostExporter.greptimedb.url | quote }}
      username: {{ .Values.pocCostExporter.greptimedb.username | quote }}
      password: {{ .Values.pocCostExporter.greptimedb.password | quote }}
    customers:
      {{- toYaml .Values.pocCostExporter.customers | nindent 6 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "monitoring-stack.fullname" . }}-poc-cost-exporter
  labels:
    {{- include "monitoring-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: poc-cost-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "monitoring-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: poc-cost-exporter
  template:
    metadata:
      labels:
        {{- include "monitoring-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: poc-cost-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: poc-cost-exporter
          image: "{{ .Values.pocCostExporter.image.repository }}:{{ .Values.pocCostExporter.image.tag }}"
          imagePullPolicy: {{ .Values.pocCostExporter.image.pullPolicy }}
          env:
            - name: CONFIG_PATH
              value: /config/config.yaml
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            {{- toYaml .Values.pocCostExporter.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "monitoring-stack.fullname" . }}-poc-cost-exporter-config
      {{- with .Values.pocCostExporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pocCostExporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
